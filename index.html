# Roteiro Completo — João Pessoa (PB) e região

> Compilado a partir de 8 transcrições do canal **Fabi Cassol | Minha Praia Viajar** + endereços exatos pesquisados na internet (a Fabi quase nunca cita endereço; tudo que está marcado como *[endereço pesquisado]* veio de busca, não das transcrições).
>
> **Estadia:** volta para JP dia **23 à noite** → contagem a partir de **24/09**. Dias em João Pessoa: **24 a 30/09** (sáb 24 → sex 30). Descanso em **Recife: 30/09 à noite → 01/10**.

---

## ⭐ 1. PISCINAS NATURAIS (a parte obrigatória — vocês amaram as de Natal)

João Pessoa tem **piscinas naturais de recifes de coral** que só aparecem/são acessíveis na **MARÉ BAIXA**. Isso é a regra de ouro repetida em TODOS os vídeos:

> "Vocês precisam fazer esse passeio na maré baixa, na verdade **todos os passeios com piscinas naturais precisam ser na maré baixa**, não só em João Pessoa mas em qualquer lugar do mundo. Quem não souber ver a maré pode entrar em contato direto com a agência **Nostur/Nosso Tour** que eles passam os dias certinhos."

A Fabi ama fazer **snorkel** nelas: *"chegou minha parte preferida que é fazer snork e ver os peixinhos… quando você nada mais afastado das embarcações você consegue ver diversas espécies de peixe, coisa mais linda"* — dica dela: **afaste-se dos barcos e das pessoas**; perto do barco só aparece "peixe turista" (branquinho listrado).

### As 4 opções de piscinas naturais citadas

| # | Piscina natural | Saída / como chega | Tempo de barco | Observações da Fabi |
|---|-----------------|--------------------|----------------|---------------------|
| 1 | **Picãozinho** ⭐ (a mais tradicional/famosa e a mais perto) | Catamarã saindo da **Praia de Tambaú** (em frente ao antigo Hotel Tambaú) | **~15 min** só | "Primeiro passeio náutico da cidade, um dos trechos mais pertos. Barco fica ~2h nas piscinas. Tem espetinho de camarão, pedê de frango, cerveja, caipirinha." Preço do passeio **a partir de R$30–60/pessoa**. |
| 2 | **Piscinas naturais de Seixas** (as mais famosas segundo ela, mas mais longe) | Catamarã saindo da **Praia de Tambaú** | **~40 min** (ida) + 40 min (volta) | "As piscinas mais famosas daqui. Trecho bem mais longe que Picãozinho. Piscinas grandes, dá pra espalhar bastante." Dica: quem enjoa fácil, **tome remédio antes** (a amiga dela enjoou nos 40 min). |
| 3 | **Ilha de Areia Vermelha** (+ Areia Dourada) | Barco/catamarã/lancha saindo do **Iate Clube de Cabedelo / Praia do Jacaré** | passeio de dia inteiro | Banco de areia que **surge no meio do mar na maré baixa e some quando a maré sobe** ("em menos de 5 min some tudo"). Corais para nadar, água transparente e quentíssima. Drink famoso: **ULA no abacaxi ~R$35**. |
| 4 | **Praia de Tambaba** (litoral sul) | Passeio de buggy litoral sul (ver seção Passeios) | — | "Formam piscininhas naturais na maré baixa entre as rochas, mais transparentes." ⚠️ Praia de **naturismo** (nudismo obrigatório só depois do portal; antes dá pra ficar de roupa). |
| 5 (bônus) | **Caminho de Moisés** (Lucena, litoral norte) | Buggy + balsa (litoral norte) | — | Banco de areia com um "piscinão" gigante no meio do mar na maré baixa; *"dependendo da maré dá pra entrar até 200 m mar adentro"*. Água azul e quente. |

**Estimativa de tempo por passeio de piscina:** Picãozinho = **meio período (~3h no total com deslocamento)**; Seixas = **meio período longo (~4h)**; Areia Vermelha = **dia inteiro**.

> 🔴 **AÇÃO CRÍTICA:** antes de fechar a grade, ligue para a **Nosso Tour / Nostur** e peça os **horários de maré baixa dos dias 24–30/09**. As piscinas naturais dependem 100% disso — a grade abaixo já reserva os melhores encaixes, mas o dia exato de cada piscina pode precisar trocar conforme a maré.

## 🍺 2. BALADAS E BARZINHOS À NOITE (onde é mais recomendado)

Resumo honesto da Fabi: **"João Pessoa é cidade tranquila à noite, a vida noturna acaba cedo. Música ao vivo é mais sexta e fim de semana."** Não é destino de "fervo" — é mais praia/descanso. No Carnaval inclusive **não há Carnaval de rua forte** (é mais pré-carnaval e festas pontuais). Os 3 polos noturnos:

### A) Largo de Tambaú / o Letreiro (principal ponto de encontro à noite)
Fica na **divisa entre Praia de Cabo Branco e Tambaú**, em frente ao letreiro "João Pessoa". Fim de semana e feriado lota. Ao redor: vários barzinhos, feirinha de artesanato à noite, lojinhas, restaurantes. Bares citados aqui:
- **Matuto Teimoso** — bar/restaurante de frente pro letreiro, **música ao vivo (forró) todos os dias**, preços "super justos". *Recomendado pela Fabi.*
- **Barzinhos Pretos** — "estava lotadão no sábado de Carnaval, música ao vivo".
- Kiosques beira-mar com música ao vivo.

### B) Orla de Cabo Branco à noite (a região mais tranquila — recomendada p/ quem quer sossego)
Fica **~2 km ao sul do letreiro**. Quem se hospeda aqui **não sofre com o barulho** das festas do letreiro. Quiosques de água de coco abertos à noite, quadras de vôlei. Citados:
- **Quiosque Tubarão** — um dos mais movimentados, **música ao vivo**. Porção de carne de sol, isca de peixe, pratos executivos.
- **Nevada do Val** — fila gigante; bebida famosa de coco batido com gelo/leite condensado (~R$15).
- **Parque Cabo Branco** — praça de **food trucks** (taco, hambúrguer, sushi, **crepe francês de carne de sol e queijo coalho ~R$27**, coxinha). Música ao vivo à noite. "Come a partir de ~R$15." *A Fabi adora.*

### C) ⭐ "Rua Secreta" = Rua dos Sabores (a dica de gente local)
Nome oficial: **Rua Joaquim Avundano, bairro Miramar** *[endereço pesquisado]* — a ~2 km do letreiro. Rua gastronômica revitalizada pela prefeitura (inaugurada out/2024) para espalhar o turismo além da orla. Tem bares, pizzaria, confeitaria, padaria, cafeteria, **música ao vivo**. Citados pela Fabi:
- **Bar Alquimia**
- **Jones Grill** — "fiquei sabendo que é muito bom"
- **Forró/sertanejo** ao vivo na rua
- **Beco Mágico** (hamburgueria temática, aranha na fachada, fila enorme) — fica perto, atravessando a pracinha.

### Onde mais tem vida noturna espalhada
Bairros **Bessa** e **Jardim Oceania**: pubs, restaurantes, bares e opções de happy hour. **Centro** também tem algumas opções (ex.: **Vila do Porto**, bar/restaurante bonitinho, massas ~R$30, música ao vivo à noite).

> 💡 **Recomendação para vocês:** priorizem **sexta 25, sábado 26/09** (fim de semana = música ao vivo garantida) para a **Rua dos Sabores** e o **Largo de Tambaú**. Noites de semana → **Parque Cabo Branco (food trucks)** e quiosque **Tubarão**, que funcionam sempre.

## ⛪ 3. A IGREJA "DE 1518" — qual é o nome?

**Atenção — a data 1518 não bate com nenhuma igreja de João Pessoa.** A cidade só foi fundada em **1585**, então nenhuma igreja dela é de 1518 (seria impossível). Nas transcrições a Fabi cita datas próximas mas diferentes. As duas candidatas reais que vocês provavelmente querem visitar:

1. **⭐ Igreja de São Francisco / Centro Cultural São Francisco (Convento de Santo Antônio)** — **ESSA é a "igreja histórica" que os turistas visitam.** *A Fabi diz: "complexo religioso mais importante de João Pessoa, o conjunto barroco mais importante do Nordeste, começou a ser construído em 1560 e poucos… coisas construídas há mais de 300–400 anos."* Registros oficiais: obras iniciadas em **1589**, concluídas em **1770/1779**. É o cartão-postal barroco (azulejos portugueses pintados à mão, esculturas em madeira). **Ingresso R$20, visita guiada de ~40–50 min inclusa.** → **É quase certo que é essa a igreja que vocês querem.**

2. **Catedral Basílica de Nossa Senhora das Neves** — a **igreja matriz/padroeira** da cidade, construção original de **1586** (a mais antiga *em fundação* da cidade). Se a referência de vocês era "a igreja mais antiga da cidade", é esta.

> Se vocês viram "1518" em algum lugar, provavelmente foi um erro de digitação/leitura (talvez **1518 ↔ 1589** da São Francisco, ou **1586** da Catedral). **Minha aposta: Igreja de São Francisco.** Confirmem pela foto/aparência.

Outras igrejas históricas da região (citadas nos passeios):
- **Igreja de Nossa Senhora da Guia** (Lucena, litoral norte) — construída em **1591** pelos portugueses; tem o **maior altar-mor de calcário do Brasil**, 100% esculpido à mão. Fecha em feriados.

## 🏖️ 4. PRAIAS

### Praias urbanas de João Pessoa (orla estruturada, ciclovia, quiosques)
- **Cabo Branco** — 4 km, a preferida da Fabi. Areia amarelada/alaranjada, ótima pra caminhar. **Lado sul (final) = mais tranquilo e recomendado pra hospedagem**, longe do agito. Mirante do Cabo Branco (praça de 2024, ótima pro pôr do sol com prédios ao fundo).
- **Tambaú** — a mais movimentada dia e noite; região mais turística; saída dos catamarãs das piscinas.
- **Manaíra** — bairro residencial turístico, orla boa pra caminhar mas mar não é o principal; **checar balneabilidade**.
- **Seixas / Penha** — abaixo do Farol; formam piscininhas na maré baixa.

### Cabedelo (município vizinho — ⭐ mar mais azul que JP, segundo ela)
*"Achei as praias de Cabedelo muito mais bonitas na cor do mar do que JP — aqui é mais azul. A diferença é que não tem estrutura tão boa de restaurantes."*
- **Ponta de Campina** — decks/passarelas de madeira lindas, mar incrível.
- **Camboinha** — água muito azul, 30–31 °C; dá pra ver a ilha de Areia Vermelha; menos estrutura (quiosques).
- **Praia Formosa** e **Dique de Cabedelo** (letreiro, trapiche; de um lado o mar, do outro o rio Paraíba; dá no Jacaré seguindo reto).
- **Intermares** — primeira praia da cidade.

### Litoral Sul — Conde (as mais bonitas, via buggy)
- **⭐ Coqueirinho** (município de Conde, ~35 km) — **já eleita uma das 10 praias mais bonitas do Brasil.** Dois lados: um com ondas (estrutura de restaurante) e outro de **enseada = "piscinão" gigante calmo**. Muitos coqueiros p/ sombra. Trilha de 2 min entre os lados.
- **Tambaba** — 1ª praia de naturismo do Nordeste (nudismo só após o portal). Piscininhas naturais na maré baixa.
- **Barra de Gramame** — divisa JP/Conde, vila de pescadores, manguezal, história do caranguejo, banho de rio.

### Litoral Norte — Lucena (via buggy + balsa)
- **Caminho de Moisés** (piscina natural — ver seção 1)
- **Barra do Miriri** — falésias avermelhadas, 2 rios desaguando no mar, banho de rio.
- **Coqueiral** — 3ª maior fazenda de coqueiros do Brasil (+300 coqueiros), buggy passa no meio.

## 🏛️ 6. CENTRO HISTÓRICO E CULTURA

- **Centro Cultural / Igreja de São Francisco** (ver seção 3) — R$20, ~1h.
- **Catedral Basílica N. Sra. das Neves** (ver seção 3).
- **Estação Cabo Branco (Ciência, Cultura e Artes)** — projeto de **Oscar Niemeyer**, ao lado do Farol. Museu, exposições, **Mirante 360°**. Grátis. ~1h.
- **Farol do Cabo Branco** — único farol triangular do Brasil (formato = planta sisal), em cima das falésias. Ao lado: **Bosque dos Sonhos** (parque ecológico grátis, lojinhas de artesanato, castanha, licores/cachaça de doce de leite ~R$35). **Ponta do Seixas = ponto mais oriental das Américas** (mais perto da África do que de Porto Alegre; 1º lugar das Américas a ver o sol nascer — amanhece 4h50–5h20).
- **Parque Solon de Lucena ("Lagoa")** — parque com lagoa, ciclovia, palmeiras; divide a cidade (histórica x nova). Bom p/ caminhada/piquenique. ~1h.
- **Centro histórico**: **Praça Antenor Navarro** (casario colorido, hoje meio abandonado/pichado, em restauração), **Hotel Globo** (~100 anos, patrimônio, mirante do rio Sanhauá com pôr do sol), rio Sanhauá (por onde os portugueses chegaram). JP é a **3ª cidade mais antiga do Brasil**.

**Compras (mais barato fora da orla):**
- **⭐ Mercado de Artesanato Paraibano** — Av. Rui Carneiro, 241, Tambaú *[endereço pesquisado]*. Funciona **9h–18h (dom/feriado 9h–14h)**. Dois andares, dezenas de lojinhas, **castanha de caju mais barata** (doce e salgada), licor de doce de leite (~R$10 sem embalagem). Melhor lugar p/ lembrancinhas.
- Feirinhas de artesanato de **Tambaú** (em frente ao antigo hotel) e do **Largo de Tambaú** (à noite).

**Onde comer (citados):**
- **⭐ Sky Restô** — restaurante favorito da Fabi, **45º andar do Complexo Tour Geneve, Altiplano** *[endereço pesquisado]* — restaurante mais alto com vista para o mar da América Latina. Peça mesa na janela (reserva!). Dadinho de tapioca, bruschetta, carpaccio, camarão. Taxa R$25/pessoa (isenta acima de R$80). *(Do mesmo grupo: **Skybar**, bar no 44º andar, taxa acesso ~R$30, sobe 16h–23h45.)*
- **Ó Mar** (rooftop do Hotel Bara, ao lado do letreiro, Cabo Branco) — de frente pro mar.
- **Praiano** (Jardim Oceania) — beira-mar, cadeiras de praia, drinks.
- **Restaurante Corais** e **Gulliver** (Cabo Branco sul) — "melhor camarão da cidade", segundo recomendação.
- **Restaurante ao Mar** (hotel novo, Cabo Branco) — mais chique, pratos R$80–90.
- **Mangai** (Manaíra) — comida nordestina típica.
- **Canoa dos Camarões** (Manaíra).
- **Vila do Porto** (Centro) — massas ~R$30, vista do rio, música ao vivo à noite.
- **Creperia francesa** no Parque Cabo Branco — crepe de carne de sol + queijo coalho ~R$27.

## 🗓️ 10. GRADE SUGERIDA — 24 a 30/09 (com várias opções)

> Datas 2026: **24=QUI · 25=SEX · 26=SÁB · 27=DOM · 28=SEG · 29=TER · 30=QUA.** (Oct 1 = qui, em Recife.)
> ✅ A grade já está **alinhada com a tábua de marés** acima: piscinas caem nos dias de baixa-mar mais forte (26–28/09, Lua Cheia). Confirme só os horários de saída com a Nosso Tour.

### 📅 QUI 24/09 — Chegada leve + orla + noite (baixa-mar 08:35)
- **Manhã:** relaxar, reconhecer a orla de **Cabo Branco** (lado sul, tranquilo). Coco na praia, almoço beira-mar (Corais/Gulliver p/ camarão).
- **Tarde:** **Farol do Cabo Branco + Estação Cabo Branco (Mirante 360°) + Bosque dos Sonhos + Ponta do Seixas** (ponto mais oriental). Pôr do sol no **Mirante do Cabo Branco**.
- **Noite (sábado = melhor noite):** **Largo de Tambaú / Letreiro** — barzinho **Matuto Teimoso** (forró ao vivo) + feirinha. *Opção:* **Rua dos Sabores** (Miramar).

### 📅 SEX 25/09 — ⭐ Piscinas naturais de PICÃOZINHO + tarde de compras (baixa-mar 09:08 → sair ~7h30–8h)
- **Manhã (conforme maré, saída ~8h):** **Catamarã Picãozinho** (mais perto, ~15 min) — snorkel, peixinhos. **A primeira dose de piscina natural.**
- **Tarde:** **Mercado de Artesanato Paraibano** (sexta, aberto até 18h) OU descanso na praia de Tambaú.
- **Noite:** **Parque Cabo Branco** (food trucks, crepe de carne de sol) — clima família, música ao vivo.

### 📅 SÁB 26/09 — Passeio de dia inteiro: BUGGY LITORAL SUL (baixa-mar 09:41 — bom p/ piscininhas de Tambaba)
- **Dia todo (5–7h):** **Nosso Tour / PNP** — Barra de Gramame → Mirante das falésias → **Shopping Rural Doce Tambaba** → **Tambaba** (piscininhas naturais + naturismo opcional) → **⭐ Coqueirinho** (enseada "piscinão", uma das praias mais bonitas do Brasil). Almoço beira-mar em Coqueirinho (peixe + batata ~R$75).
- **Noite:** descanso / jantar tranquilo na orla (dia foi puxado).

### 📅 DOM 27/09 — ⭐⭐ Piscinas de SEIXAS (dia de MARÉ MAIS FORTE, baixa 10:32 = 0,18 m, Lua Cheia)
- **Manhã (saída ~9h):** **Catamarã piscinas de Seixas** (40 min de barco, piscinas grandes). *Leve remédio de enjoo.* **Melhor dia da semana para snorkel — recifes máximo expostos, água mais cristalina.**
- **Fim de tarde:** relaxar na orla.
- **Noite:** jantar no **⭐ Sky Restô** (45º andar, vista do mar — **faça reserva p/ mesa na janela**). Drink no **Skybar** depois.

### 📅 SEG 28/09 — ⭐ Passeio de BARCO: Areia Vermelha + Pôr do sol do Jacaré (baixa-mar 11:06 = meio-dia, banco de areia totalmente exposto)
- **Dia todo:** **Real Mar (Marcos/Lídia)** — **Ilha de Areia Vermelha** (banco de areia que surge no mar na maré baixa — baixa ao meio-dia = ilha 100% exposta, perfeito! 3ª dose de piscina natural), Areia Dourada, Ilha da Restinga, churrasco a bordo, navegação no rio.
- **Fim de tarde (~17h):** **Pôr do sol da Praia do Jacaré** com **Jurandy do Sax (Bolero de Ravel)** ao vivo. Feirinha do Jacaré à noite.

### 📅 TER 29/09 — Litoral Norte (Lucena) OU Cabedelo + Centro histórico (baixa-mar 11:44 = meio-dia, ótimo p/ Caminho de Moisés)
**Opção A (aventura):** **Buggy/Carro Litoral Norte** — balsa → **Caminho de Moisés** (piscinão no mar, 4ª dose de piscina natural) → Coqueiral → Barra do Miriri → **Igreja N. Sra. da Guia (1591)** → **Fortaleza de Santa Catarina**.
**Opção B (cultura + praia calma):** manhã nas praias de **Cabedelo** (Ponta de Campina, Camboinha — mar mais azul) + tarde no **Centro Histórico** (**⭐ Igreja de São Francisco**, Catedral das Neves, Hotel Globo, Praça Antenor Navarro).
- **Noite:** última noite em JP — **Rua dos Sabores** (Jones Grill / Bar Alquimia / Beco Mágico) ou quiosque **Tubarão**.

### 📅 QUA 30/09 — Manhã tranquila + viagem para Recife
- **Manhã:** **Parque Solon de Lucena (Lagoa)** rápido OU última praia + compras de última hora no Mercado de Artesanato. Se sobrou a **Igreja de São Francisco**, encaixe aqui.
- **Tarde:** **viagem JP → Recife** (~120–130 km, **~2h de carro**). Check-in em Recife/Boa Viagem/Olinda.
- **Noite:** jantar leve em Recife. **Início do descanso.**

> **Dias "mais leves" embutidos** (você pediu ritmo com descanso): tardes de 25 e 27 e a manhã de 30 são folgadas de propósito. Se quiser um dia 100% praia sem passeio, troque o **Litoral Norte (29)** por praia + spa.

## 🌴 11. RECIFE — DESCANSO (30/09 noite → 01/10)

Dia de **descanso**, então roteiro leve, sem correria:
- **Onde ficar:** **Boa Viagem** (praia urbana, cômodo) ou **Olinda** (charme histórico, pousadas).
- **Opção descanso praia:** manhã na **Praia de Boa Viagem** (⚠️ há áreas com risco de tubarão — banho só nas faixas sinalizadas/piscinas de arrecifes na maré baixa) OU bate-volta a **Porto de Galinhas** (~1h de Recife): **jangada até as piscinas naturais** (na mesma pegada que vocês amam!).
- **Opção cultural leve:** **Olinda** — Alto da Sé (vista das igrejas), ladeiras, ateliês; **Recife Antigo** — Marco Zero, Rua do Bom Jesus, Paço do Frevo.
- **01/10:** manhã tranquila conforme voo/volta.

> Se o descanso for prioridade máxima: fiquem só em **Boa Viagem** ou **Porto de Galinhas**, sem city tour. As piscinas naturais de jangada de Porto de Galinhas são o "fecho" perfeito da viagem, no mesmo estilo das de João Pessoa e Natal.

## ✅ 12. DICAS PRÁTICAS (da Fabi + pesquisa)

- **MARÉ BAIXA** manda em TODAS as piscinas naturais → confirme horários com **Nosso Tour/Nostur** antes de fixar a grade.
- **Balneabilidade:** antes de entrar no mar em praia urbana, cheque se está própria (algumas épocas fica imprópria — vale p/ qualquer praia do mundo).
- **Clima:** faz sol o ano todo; **maio–agosto = período de chuva** (mar mais marrom pelas falésias); **set–mar** = mar mais azul/cristalino. **Vocês pegam fim de setembro = ótima janela** (transição p/ tempo seco).
- **Cor do mar:** amarelada em Cabo Branco/Seixas é **natural** (falésias soltam areia), não é sujeira. Cabedelo/litoral = mais azul.
- **Segurança:** cidade tranquila e segura, principalmente nas áreas turísticas.
- **Sol nasce cedíssimo** (4h50–5h20) — bom p/ acordar cedo nos passeios de maré.
- **⚠️ Cuidado com cocos** caindo dos coqueiros na orla.
- **Como chegar:** aeroporto de JP fica ~20 km de Tambaú; passagem por **Recife** costuma sair ~metade do preço (130 km / ~2h).
- **Hospedagem recomendada:** **Cabo Branco lado sul** (perto de tudo, longe do barulho do letreiro) — a Fabi tem flat no prédio **Unity** (Airbnb).

    var inDay=EX.filter(function(e){return e.d>=dstart&&e.d<dend;});
    var note='';
    if(!inDay.length){dstart=new Date(2026,8,27);dend=new Date(dstart.getTime()+86400000);inDay=EX.filter(function(e){return e.d>=dstart&&e.d<dend;});note=' — exemplo 27/09 (hoje fora do período)';}
    function xOf(min){return padL+(min/1440)*plW;}
    function yOf(h){return padT+(1-h/HD)*plH;}
    function mins(dt){return (dt-dstart)/60000;}
    function hAt(dt){var p=null,n=null;for(var i=0;i<EX.length-1;i++){if(EX[i].d<=dt&&dt<EX[i+1].d){p=EX[i];n=EX[i+1];break;}}if(!p||!n)return null;var ph=(dt-p.d)/(n.d-p.d);return p.h+(n.h-p.h)*(1-Math.cos(Math.PI*ph))/2;}
    var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Grafico de mare do dia">';
    var sr=305, ss=1035;
    s+='<rect x="'+padL+'" y="'+padT+'" width="'+(xOf(sr)-padL)+'" height="'+plH+'" fill="rgba(40,44,64,.07)"/>';
    s+='<rect x="'+xOf(ss)+'" y="'+padT+'" width="'+(padL+plW-xOf(ss))+'" height="'+plH+'" fill="rgba(40,44,64,.07)"/>';
    [0.5,1,1.5,2,2.5].forEach(function(hv){var y=yOf(hv);s+='<line x1="'+padL+'" y1="'+y+'" x2="'+(padL+plW)+'" y2="'+y+'" stroke="#eee"/>';});
    [0,1,2].forEach(function(hv){var y=yOf(hv);s+='<text x="'+(padL-6)+'" y="'+(y+4)+'" font-size="14" fill="#aaa" text-anchor="end">'+hv+'m</text>';});
    for(var hh=0;hh<=24;hh+=3){var x=xOf(hh*60);s+='<line x1="'+x+'" y1="'+padT+'" x2="'+x+'" y2="'+(padT+plH)+'" stroke="#f3f3f3"/>';s+='<text x="'+x+'" y="'+(padT+plH+18)+'" font-size="14" fill="#999" text-anchor="middle">'+hh+'h</text>';}
    var pts=[];for(var m=0;m<=1440;m+=15){var dt=new Date(dstart.getTime()+m*60000);var hv=hAt(dt);if(hv!=null)pts.push([xOf(m),yOf(hv)]);}
    if(pts.length){
      var d='M'+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1);for(var i=1;i<pts.length;i++)d+=' L'+pts[i][0].toFixed(1)+' '+pts[i][1].toFixed(1);
      var area=d+' L'+pts[pts.length-1][0].toFixed(1)+' '+yOf(0).toFixed(1)+' L'+pts[0][0].toFixed(1)+' '+yOf(0).toFixed(1)+' Z';
      s+='<path d="'+area+'" fill="rgba(10,110,189,.12)"/>';
      s+='<path d="'+d+'" fill="none" stroke="#0a6ebd" stroke-width="2.5"/>';
    }
    inDay.forEach(function(e){
      var x=xOf(mins(e.d)),y=yOf(e.h),hh=e.d.getHours(),day=(hh>=6&&hh<17);
      var lx=Math.max(padL+44,Math.min(padL+plW-44,x));
      s+='<circle cx="'+x+'" cy="'+y+'" r="3.5" fill="'+(e.t==='L'?'#0a7d5a':'#0a6ebd')+'"/>';
      if(e.t==='L'){
        var spot=hh<9?'Picãozinho':hh<11?'Seixas':hh<14?'Areia Vermelha':'piscinas';
        var star=e.h<=0.25?'🔥':'⭐';
        var rec=day?(star+' '+spot):'baixa (noite)';
        s+='<text x="'+lx+'" y="'+(y-20)+'" font-size="17" font-weight="700" fill="#0a7d5a" text-anchor="middle">'+rec+'</text>';
        s+='<text x="'+lx+'" y="'+(y-7)+'" font-size="15" fill="#555" text-anchor="middle">'+hm(e.d)+' · '+e.h.toFixed(2).replace('.',',')+'m</text>';
      } else {
        var rl=day?'🔵 banho de mar':'preamar';
        s+='<text x="'+lx+'" y="'+(y+16)+'" font-size="16" font-weight="600" fill="#0a6ebd" text-anchor="middle">'+rl+'</text>';
        s+='<text x="'+lx+'" y="'+(y+30)+'" font-size="15" fill="#555" text-anchor="middle">'+hm(e.d)+' · '+e.h.toFixed(2).replace('.',',')+'m</text>';
      }
    });
    if(now>=dstart&&now<dend){
      var xn=xOf(mins(now)),hvn=hAt(now),yn=hvn!=null?yOf(hvn):padT;
      s+='<line x1="'+xn+'" y1="'+padT+'" x2="'+xn+'" y2="'+(padT+plH)+'" stroke="#e8552d" stroke-width="2" stroke-dasharray="4 3"/>';
      if(hvn!=null)s+='<circle cx="'+xn+'" cy="'+yn+'" r="5" fill="#e8552d"/>';
      var nx=Math.max(padL+30,Math.min(padL+plW-30,xn));
      s+='<text x="'+nx+'" y="'+(padT-8)+'" font-size="16" font-weight="700" fill="#e8552d" text-anchor="middle">agora '+hm(now)+'</text>';
    }
    s+='</svg>';
    document.getElementById('tgraph').innerHTML='<div class="tgtitle">📈 Maré do dia'+note+'</div>'+s+'<div class="tglegend">Área azul = maré · linha laranja = agora · faixa cinza = noite · 🟢 ⭐ baixa-mar = piscinas naturais · 🔵 cheia = banho de mar / barco.</div>';
  }

  renderNow(); renderCards(); buildGraph();
  setInterval(function(){renderNow();renderCards();buildGraph();},60000);
</script>
